inputs:
  fundamental_path: "${paths.cleaned_data_dir}/fundamental.csv"
  story_path: "${paths.cleaned_data_dir}/story.csv"
  economics_path: "${paths.cleaned_data_dir}/economics.csv"
  technical_path: "${paths.cleaned_data_dir}/technical.csv"

outputs:
  preprocessed_filename: "qai_preprocessed.csv"
  train_filename: "train.csv"
  val_filename: "val.csv"
  test_filename: "test.csv"
  metadata_filename: "qai_preprocess_metadata.json"

ticker_column: "ticker"
date_column: "date"
sequence_length: 4
resample_frequency: "daily"
time_horizon: 180
time_horizontal: null
train_ratio: 0.7
val_ratio: 0.15
test_ratio: 0.15
fill_story_missing_with_zero: true
fill_fmp_missing_with_zero: false
min_sequence_points: null
