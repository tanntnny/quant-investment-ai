provider:
  simfin:
    type: simfin
    api_key: null
    env_file: ".env"
    api_key_env: "SIMFIN_API_KEY"
    cache_template: "simfin_raw_{ticker}.pkl"
    historical_price_years: 10
    market: us
    fundamentals_variant: quarterly
    prices_variant: daily
    force_refresh: false
  alphavantage:
    env_file: ".env"
    api_key_env: "ALPHA_VANTAGE_API_KEY"
    api_call_per_minute: 75
    topics: null
    sort: LATEST
    limit: 50
    divide_range_days: null
  fmp:
    env_file: ".env"
    api_key_env: "FMP_API_KEY"
    base_url: "https://financialmodelingprep.com/stable"
    api_calls_per_minute: 300
    timeout_seconds: 30.0
    max_retries: 2
    force_refresh: false
    allow_partial_fmp: false
    economic_indicators:
      - name: GDP
        column: gdp
      - name: realGDP
        column: real_gdp
      - name: nominalPotentialGDP
        column: nominal_potential_gdp
      - name: realGDPPerCapita
        column: real_gdp_per_capita
      - name: federalFunds
        column: federal_funds_rate
      - name: CPI
        column: cpi
      - name: inflationRate
        column: inflation_rate
      - name: inflation
        column: inflation
      - name: retailSales
        column: retail_sales
      - name: consumerSentiment
        column: consumer_sentiment
      - name: durableGoods
        column: durable_goods
      - name: unemploymentRate
        column: unemployment_rate
      - name: totalNonfarmPayroll
        column: total_nonfarm_payroll
      - name: initialClaims
        column: initial_claims
      - name: industrialProductionTotalIndex
        column: industrial_production_total_index
      - name: newPrivatelyOwnedHousingUnitsStartedTotalUnits
        column: housing_starts_total_units
      - name: totalVehicleSales
        column: total_vehicle_sales
      - name: retailMoneyFunds
        column: retail_money_funds
      - name: smoothedUSRecessionProbabilities
        column: smoothed_us_recession_probabilities
      - name: 3MonthOr90DayRatesAndYieldsCertificatesOfDeposit
        column: cd_3m_90d_rate
      - name: commercialBankInterestRateOnCreditCardPlansAllAccounts
        column: credit_card_interest_rate_all_accounts
      - name: 30YearFixedRateMortgageAverage
        column: mortgage_30y_fixed_average
      - name: 15YearFixedRateMortgageAverage
        column: mortgage_15y_fixed_average
