provider:
  simfin:
    type: simfin
    api_key: null
    env_file: ".env"
    api_key_env: "SIMFIN_API_KEY"
    cache_template: "simfin_raw_{ticker}.pkl"
    historical_price_years: 10
    market: us
    fundamentals_variant: quarterly
    prices_variant: daily
    force_refresh: false
  alphavantage:
    env_file: ".env"
    api_key_env: "ALPHA_VANTAGE_API_KEY"
    api_call_per_minute: 75
    topics: null
    sort: LATEST
    limit: 50
    divide_range_days: null
dataset:
  ttm_window: 4
  zscore_window: 12
  zscore_min_periods: 1
  winsorize_lower_quantile: 0.01
  winsorize_upper_quantile: 0.99
  market_cap_min: 1000000.0
outputs:
  fundamental_filename: "fundamental.csv"
  story_filename: "story.csv"
