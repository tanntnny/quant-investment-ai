# @package _global_

defaults:
  - override /mode: train
  - override /data: qai_portfolio_datamodule
  - override /model: qai_portfolio_attention
  - override /loss: qai_portfolio_growth
  - override /metrics: qai_portfolio
  - override /optimizer: adamw
  - override /trainer: pytorch

name: qai_portfolio_train

trainer:
  max_epochs: 500
  accelerator: auto

loss:
  risk_penalty: 0.0
  concentration_penalty: 0.0

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      portfolio_model: attention,bilstm,lightgbm
      loss.risk_penalty: 1.0, 10.0, 100.0
      loss.concentration_penalty: 1.0, 10.0, 100.0
