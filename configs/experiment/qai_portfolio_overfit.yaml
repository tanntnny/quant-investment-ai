# @package _global_

defaults:
  - override /mode: train
  - override /data: qai_portfolio_datamodule
  - override /model: qai_portfolio_attention
  - override /loss: qai_portfolio_growth
  - override /metrics: qai_portfolio
  - override /optimizer: adamw
  - override /trainer: pytorch

name: qai_portfolio_overfit

data:
  batch_size: 1

model:
  dropout: 0.0

trainer:
  max_epochs: 1
  max_steps: -1
  accelerator: auto

optimizer:
  lr: 0.003
  weight_decay: 0.0

loss:
  risk_penalty: 0.0
  concentration_penalty: 0.0

overfit:
  steps: 200
  batch_index: 0
  log_every_n_steps: 10
  min_loss_reduction: 0.000001
  fail_on_no_improvement: true

hydra:
  mode: RUN
  run:
    dir: outputs/qai_portfolio_overfit/${now:%Y-%m-%d_%H-%M-%S}
